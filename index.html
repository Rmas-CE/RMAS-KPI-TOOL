<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>POSM Deployment Tracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: sticky control bar (month + lock state) over a summary strip, then a TS ranking that drills into each TS's stores. Dark-first, VaultSync teal. */
:root{
  --bg:#0b1519; --panel:#11202600; --surface:#122329; --surface2:#17303a; --line:#21404b;
  --fg:#e3f1f3; --muted:#8aa8b0; --accent:#2fd6c3; --accent-ink:#04201c;
  --ok:#3ccf7e; --ok-bg:#123d29; --ex:#4fb3ff; --ex-bg:#0f2f4a; --bad:#ff8a5c; --bad-bg:#47220f;
  --nc:#7d939a; --nc-bg:#1a2b31; --warn-bg:#3a3111; --warn:#f2c94c;
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#eef4f5; --surface:#ffffff; --surface2:#e3eef0; --line:#c9dbdf;
  --fg:#0e2329; --muted:#4e6a72; --accent:#0a8f82; --accent-ink:#ffffff;
  --ok:#137a43; --ok-bg:#d8f3e3; --ex:#1660a8; --ex-bg:#dcebfb; --bad:#b4461b; --bad-bg:#fde5da;
  --nc:#5f747a; --nc-bg:#e6edef; --warn-bg:#fbf0c9; --warn:#7a5a00; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#eef4f5; --surface:#ffffff; --surface2:#e3eef0; --line:#c9dbdf;
  --fg:#0e2329; --muted:#4e6a72; --accent:#0a8f82; --accent-ink:#ffffff;
  --ok:#137a43; --ok-bg:#d8f3e3; --ex:#1660a8; --ex-bg:#dcebfb; --bad:#b4461b; --bad-bg:#fde5da;
  --nc:#5f747a; --nc-bg:#e6edef; --warn-bg:#fbf0c9; --warn:#7a5a00; color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--f-body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin-bottom:18px}
.top-in{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding-block:12px}
.brand{display:flex;flex-direction:column;margin-right:auto;min-width:0}
.brand small{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.14em;color:var(--accent);font-size:11px;font-weight:600}
.brand h1{font-size:22px;line-height:1.1}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sel,.btn,.inp{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-height:36px}
.btn{font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.lock{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;font-family:var(--f-display);text-transform:uppercase;letter-spacing:.08em}
.lock.open{background:var(--ok-bg);color:var(--ok)}
.lock.closed{background:var(--warn-bg);color:var(--warn)}
.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:0}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.03em;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{color:var(--fg);border-color:var(--accent)}

.sync{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--nc)}
.sync.ok::before{background:var(--ok)} .sync.busy::before{background:var(--warn)} .sync.err::before{background:var(--bad)}
.banner{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:10px 14px;margin-bottom:16px;font-size:13px}
.banner b{font-weight:600}
.banner .btn{min-height:30px;padding:4px 10px;background:transparent;border-color:currentColor;color:inherit}

/* summary strip */
.strip{display:grid;grid-template-columns:1.4fr repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:22px}
.cell{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.cell .lbl{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.1em;font-size:11.5px;color:var(--muted);font-weight:600}
.cell .val{font-size:26px;line-height:1.15}
.cell .sub{font-size:12px;color:var(--muted)}
.cell.hero .val{font-size:40px;color:var(--accent)}
.meter{height:8px;border-radius:4px;background:var(--surface2);display:flex;overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%}
.m-ok{background:var(--ok)} .m-ex{background:var(--ex)} .m-bad{background:var(--bad)} .m-nc{background:var(--nc-bg)}
@media (max-width:760px){.strip{grid-template-columns:1fr 1fr}.cell.hero{grid-column:1/-1}}

.sec-h{display:flex;flex-wrap:wrap;gap:10px;align-items:end;justify-content:space-between;margin:6px 0 10px}
.sec-h h2{font-size:20px}
.sec-h p{margin:0;color:var(--muted);font-size:13px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.filters .inp{min-width:0;flex:1 1 180px}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:720px}
.lnk{background:none;border:0;padding:0;color:var(--accent);font-weight:600;font-size:12px}
.trrow{display:flex;gap:8px;align-items:flex-start;padding:4px 0;font-size:13px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.08em;font-size:11.5px;color:var(--muted);font-weight:600;background:var(--surface2);position:sticky;top:0}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface2)}
.rank{color:var(--muted);width:40px}
.tsname{font-weight:600}
.reg{font-size:12px;color:var(--muted)}
.bar{display:flex;align-items:center;gap:8px;min-width:150px}
.bar .meter{flex:1;margin:0;height:6px}

.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.g-out,.g-exc{background:var(--ok-bg);color:var(--ok)}
.g-vg,.g-good{background:var(--ex-bg);color:var(--ex)}
.g-ni,.g-poor{background:var(--bad-bg);color:var(--bad)}
.g-none{background:var(--nc-bg);color:var(--nc)}

/* status select chips */
.st{appearance:none;-webkit-appearance:none;border:1px solid transparent;border-radius:6px;padding:5px 26px 5px 9px;font-size:12.5px;font-weight:600;min-width:150px;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 13px) 55%,calc(100% - 8px) 55%;background-size:5px 5px;background-repeat:no-repeat}
.st:disabled{opacity:1;background-image:none;padding-right:9px;cursor:default}
.s-ok{background-color:var(--ok-bg);color:var(--ok)}
.s-ex{background-color:var(--ex-bg);color:var(--ex)}
.s-bad{background-color:var(--bad-bg);color:var(--bad)}
.s-nc{background-color:var(--nc-bg);color:var(--nc)}
.s-na{background-color:transparent;color:var(--muted);border-color:var(--line)}
.st option{background:var(--surface);color:var(--fg)}
.note{width:100%;min-width:180px;background:transparent;border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:13px}
.note:disabled{border-color:transparent;padding-inline:0}

/* TS detail */
.back{background:none;border:0;color:var(--accent);font-weight:600;padding:0;margin-bottom:10px}
.ts-head{display:flex;flex-wrap:wrap;gap:14px 28px;align-items:flex-end;margin-bottom:16px}
.ts-head h2{font-size:30px;line-height:1.05}
.ts-head .score{font-size:44px;color:var(--accent);line-height:1}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:12.5px;color:var(--muted);margin:0 0 14px}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

.regions{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-bottom:24px}
.regbox{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.regbox .top2{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.regbox h3{font-size:15px;letter-spacing:.04em}
.regbox .num{font-size:20px}
.regbox .sub{font-size:12px;color:var(--muted)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:14px}
.panel h3{font-size:17px;margin-bottom:6px}
.panel p{margin:0 0 10px;color:var(--muted);max-width:68ch}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.log{font-size:12.5px;color:var(--muted);max-height:220px;overflow:auto;margin:0;padding-left:18px}
.empty{padding:28px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:8px;font-weight:600;font-size:13px;z-index:20}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--fg);padding:20px;max-width:min(420px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog h3{font-size:18px;margin-bottom:8px}
dialog p{color:var(--muted);margin:0 0 12px}
dialog .inp{width:100%;margin-bottom:10px}
.err{color:var(--bad);font-size:13px;min-height:1.2em;margin:0 0 8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<header class="top">
  <div class="wrap" style="padding-bottom:0">
    <div class="top-in">
      <div class="brand"><small>RMAS · VaultSync</small><h1>POSM Deployment Tracker</h1></div>
      <div class="ctrl">
        <label class="sr" for="period" hidden>Month</label>
        <select id="period" class="sel" aria-label="Month"></select>
        <span id="lockState" class="lock"></span>
        <span id="syncState" class="sync" role="status"></span>
        <button id="loginBtn" class="btn ghost" type="button">RMAS login</button>
      </div>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-view="overview" aria-selected="true">Overview</button>
      <button class="tab" role="tab" data-view="stores" aria-selected="false">All stores</button>
      <button class="tab" role="tab" data-view="setup" aria-selected="false">Setup</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <div id="sampleBanner" class="banner" hidden>
    <span><b>Sample stores only.</b> Import your store mapping in Setup to replace them.</span>
    <button class="btn" type="button" id="goSetup">Go to Setup</button>
  </div>
  <section id="v-overview"></section>
  <section id="v-ts" hidden></section>
  <section id="v-stores" hidden></section>
  <section id="v-setup" hidden></section>
</main>

<dialog id="dlg">
  <form id="dlgForm" method="dialog">
    <h3 id="dlgTitle"></h3>
    <p id="dlgText"></p>
    <input id="dlgInput" class="inp" type="password" autocomplete="off">
    <input id="dlgInput2" class="inp" type="text" autocomplete="off" hidden>
    <p class="err" id="dlgErr"></p>
    <div class="row" style="justify-content:flex-end">
      <button class="btn ghost" type="button" id="dlgCancel">Cancel</button>
      <button class="btn primary" type="submit" id="dlgOk">OK</button>
    </div>
  </form>
</dialog>

<dialog id="tsDlg">
  <form id="tsForm" method="dialog">
    <h3>Edit Trade Supervisor</h3>
    <p id="tsDlgText"></p>
    <label class="reg" for="tsName">Name (SURNAME, FIRST NAME)</label>
    <input id="tsName" class="inp" type="text" autocomplete="off">
    <label class="reg" for="tsRegion">Region</label>
    <select id="tsRegion" class="sel" style="width:100%;margin-bottom:10px"></select>
    <p class="reg" id="tsNote" style="margin:0 0 10px"></p>
    <p class="err" id="tsErr"></p>
    <div class="row" style="justify-content:flex-end">
      <button class="btn ghost" type="button" id="tsCancel">Cancel</button>
      <button class="btn primary" type="submit" id="tsOk">Save</button>
    </div>
  </form>
</dialog>

<dialog id="stDlg">
  <form id="stForm" method="dialog">
    <h3>Edit store</h3>
    <p id="stDlgText"></p>
    <label class="reg" for="stName">Store name</label>
    <input id="stName" class="inp" type="text" autocomplete="off">
    <label class="reg" for="stTs">Trade Supervisor</label>
    <input id="stTs" class="inp" type="text" list="tsList" autocomplete="off" placeholder="Pick from the list or type a new TS">
    <label class="row reg" style="gap:8px;margin:-4px 0 10px;flex-wrap:nowrap;align-items:flex-start"><input type="checkbox" id="stFollow" checked style="margin-top:3px"><span>Use that TS's region</span></label>
    <label class="reg" for="stRegion">Region</label>
    <select id="stRegion" class="sel" style="width:100%;margin-bottom:10px"></select>
    <div class="row" style="gap:8px;flex-wrap:nowrap">
      <div style="flex:1;min-width:0"><label class="reg" for="stDealer">Dealer</label><input id="stDealer" class="inp" type="text" autocomplete="off"></div>
      <div style="width:110px"><label class="reg" for="stAgency">Agency</label><input id="stAgency" class="inp" type="text" list="agList" autocomplete="off"></div>
    </div>
    <p class="err" id="stErr"></p>
    <div class="row" style="justify-content:flex-end">
      <button class="btn ghost" type="button" id="stCancel">Cancel</button>
      <button class="btn primary" type="submit" id="stOk">Save</button>
    </div>
  </form>
</dialog>

<dialog id="trDlg">
  <form id="trForm" method="dialog">
    <h3>Transfer stores</h3>
    <p id="trDlgText"></p>
    <label class="row reg" style="gap:8px;margin-bottom:6px"><input type="checkbox" id="trAll"><span>Select all</span></label>
    <div id="trList" style="max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:6px 10px;margin-bottom:10px"></div>
    <label class="reg" for="trTs">Move to Trade Supervisor</label>
    <input id="trTs" class="inp" type="text" list="tsList" autocomplete="off" placeholder="Pick from the list or type a new TS">
    <label class="row reg" style="gap:8px;margin:-4px 0 10px;flex-wrap:nowrap;align-items:flex-start"><input type="checkbox" id="trFollow" checked style="margin-top:3px"><span>Move the stores to that TS's region</span></label>
    <p class="err" id="trErr"></p>
    <div class="row" style="justify-content:flex-end">
      <button class="btn ghost" type="button" id="trCancel">Cancel</button>
      <button class="btn primary" type="submit" id="trOk">Transfer</button>
    </div>
  </form>
</dialog>
<datalist id="tsList"></datalist><datalist id="agList"></datalist>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* ===== Baked data: WK42 TS store list — [store, trade supervisor, region, dealer, agency] ===== */
/* ===== Online backend: paste the Apps Script Web app URL (ends with /exec) ===== */
const API_URL = 'https://script.google.com/macros/s/AKfycbyqiLr5I2Cy0dQRdNxZenefc06ITJ4tduwpc6QB2mRglUbUMJvqElesO58W6kA9b3dXCQ/exec';
const ONLINE = /^https:\/\/script\.google\.com\/.+\/exec$/.test(API_URL);
const POLL_MS = 30000;
/* The store list lives only in the Google Sheet (DT_Stores) — it is no longer built into this public page. */
const DATA_VER = 'WK42';
const REGION_ORDER = ['NGMA','SGMA','NORTH LUZON','SOUTH LUZON','CENTRAL LUZON','WESTERN VISAYAS','CENTRAL VISAYAS','SOUTH MINDANAO','NORTH MINDANAO'];
const BUS = ['AV','HA','AC'];
const START_PERIOD = '2026-10';
const STATUS = {
  '':  {label:'Not checked', cls:'nc'},
  C:   {label:'Complete', cls:'ok'},
  XS:  {label:'Complete – no stock', cls:'ex'},
  XO:  {label:'Complete – outdated display', cls:'ex'},
  I:   {label:'Incomplete POSM', cls:'bad'},
  NA:  {label:'N/A (no display)', cls:'na'}
};
const STATUS_ORDER = ['','C','XS','XO','I','NA'];
const GRADES = [[95,'Outstanding','out'],[90,'Excellent','exc'],[85,'Very Good','vg'],[80,'Good','good'],[70,'Needs Improvement','ni'],[0,'Poor','poor']];
const KEY = 'rmas_posm_deploy_v1';
const QKEY = 'rmas_posm_deploy_queue';

/* ===== State ===== */
let DB = load();
let UI = {view:'overview', ts:null, period:currentPeriod(), q:'', region:'', agency:'', tsF:'', bu:'', status:'', authed:false};
let PASS = ''; try{ PASS = sessionStorage.getItem('rmas_posm_pass')||''; if(PASS) UI.authed=true; }catch(e){}
/* Viewer key from the link (?key=dtv-...) — remembered on this device. Reading needs this key or the RMAS password. */
const VIEW_KEY = (()=>{ let k=''; try{ k=(new URLSearchParams(location.search).get('key')||'').trim(); }catch(e){} try{ if(k) localStorage.setItem('rmas_dt_view_key',k); else k=localStorage.getItem('rmas_dt_view_key')||''; }catch(e){} return k; })();
let noAccessShown=false;
let QUEUE = []; try{ QUEUE = JSON.parse(localStorage.getItem(QKEY)||'[]'); }catch(e){}
let SYNC = {state: ONLINE?'loading':'offline', at:null, serverEmpty:false};

function buildFromSeed(){
  return {stores:[], ts:[], months:{}, unlocked:{}, pass:'', log:[], sample:false, dataVer:DATA_VER, closeDay:7};
}
/* TS region = region where they hold the most stores; agency likewise */
function deriveTs(stores, prev){
  const m={};
  stores.forEach(s=>{const x=m[s.ts]=m[s.ts]||{r:{},a:{}}; x.r[s.region]=(x.r[s.region]||0)+1; if(s.agency) x.a[s.agency]=(x.a[s.agency]||0)+1;});
  const top=o=>(Object.entries(o).sort((a,b)=>b[1]-a[1])[0]||[''])[0];
  return Object.entries(m).map(([name,x])=>({name,region:top(x.r),agency:top(x.a)})).sort((a,b)=>a.name.localeCompare(b.name));
}
function load(){
  let d=null;
  try{ d = JSON.parse(localStorage.getItem(KEY)||'null'); }catch(e){}
  if(!d) return buildFromSeed();
  if(!Array.isArray(d.stores)) return buildFromSeed();
  return d;
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){} }

/* ===== Periods & locking ===== */
/* A grading month runs until day closeDay of the next month (default 7): October = entries up to Nov 7. */
function closeDay(){ const d=DB&&DB.closeDay; return d==null?7:Number(d); }
function currentPeriod(){
  const d = new Date(Date.now() - closeDay()*86400000);
  const s = d.toLocaleString('en-CA',{timeZone:'Asia/Manila',year:'numeric',month:'2-digit'});
  const p = s.slice(0,7).replace('/','-');
  return p < START_PERIOD ? START_PERIOD : p;
}
function closesOn(p){
  let [y,m]=p.split('-').map(Number); const cd=closeDay();
  return cd===0 ? new Date(y,m,0).toLocaleString('en-US',{month:'short',day:'numeric'}) : new Date(y,m,cd).toLocaleString('en-US',{month:'short',day:'numeric'});
}
function periods(){
  const out=[]; let [y,m]=START_PERIOD.split('-').map(Number);
  const cur=currentPeriod();
  while(true){ const p=y+'-'+String(m).padStart(2,'0'); out.push(p); if(p>=cur) break; m++; if(m>12){m=1;y++;} }
  return out.reverse();
}
function periodLabel(p){ const [y,m]=p.split('-').map(Number); return new Date(y,m-1,1).toLocaleString('en-US',{month:'long',year:'numeric'}); }
function isLocked(p){ return p < currentPeriod() && !DB.unlocked[p]; }
function canEdit(){ return UI.authed && !isLocked(UI.period); }
function monthData(p){ return DB.months[p] || (DB.months[p]={}); }

/* ===== Scoring ===== */
function grade(pct){ if(pct==null) return {label:'No data',cls:'none'}; for(const [min,l,c] of GRADES) if(pct>=min) return {label:l,cls:c}; }
function tally(storeList, p, buF){
  const m = DB.months[p]||{}; const t={C:0,X:0,I:0,NC:0,NA:0};
  storeList.forEach(s=>(buF?[buF]:BUS).forEach(bu=>{
    const s0=(m[s.id+'|'+bu]||{}).s||'';
    if(s0==='C') t.C++; else if(s0==='XS'||s0==='XO') t.X++; else if(s0==='I') t.I++; else if(s0==='NA') t.NA++; else t.NC++;
  }));
  const graded=t.C+t.X+t.I; t.graded=graded; t.pct = graded? (t.C+t.X)/graded*100 : null; t.total=graded+t.NC;
  return t;
}
function storesOf(ts){ return DB.stores.filter(s=>s.ts===ts); }
function sortRegions(list){ return list.sort((a,b)=>{const ia=REGION_ORDER.indexOf(a), ib=REGION_ORDER.indexOf(b); return (ia<0?99:ia)-(ib<0?99:ib) || a.localeCompare(b);}); }
const fmt = v => v==null ? '—' : (Math.round(v*10)/10).toFixed(1)+'%';
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function meter(t){
  const tot=t.C+t.X+t.I+t.NC||1;
  return `<div class="meter" role="img" aria-label="${t.C} complete, ${t.X} complete no stock or outdated, ${t.I} incomplete, ${t.NC} not checked"><i class="m-ok" style="width:${t.C/tot*100}%"></i><i class="m-ex" style="width:${t.X/tot*100}%"></i><i class="m-bad" style="width:${t.I/tot*100}%"></i><i class="m-nc" style="width:${t.NC/tot*100}%"></i></div>`;
}
const legend = `<div class="legend"><span><i class="m-ok"></i>Complete</span><span><i class="m-ex"></i>Complete – no stock / outdated display (counts as complete)</span><span><i class="m-bad"></i>Incomplete POSM</span><span><i class="m-nc" style="outline:1px solid var(--line)"></i>Not checked (not counted)</span></div>`;

/* ===== Views ===== */
function render(){
  renderTop();
  document.getElementById('sampleBanner').hidden = !DB.sample || UI.view==='setup';
  ['overview','ts','stores','setup'].forEach(v=>document.getElementById('v-'+v).hidden = UI.view!==v);
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected', String(b.dataset.view===UI.view || (UI.view==='ts'&&b.dataset.view==='overview'))));
  ({overview:renderOverview, ts:renderTS, stores:renderStores, setup:renderSetup})[UI.view]();
}
function renderTop(){
  const sel=document.getElementById('period');
  sel.innerHTML = periods().map(p=>`<option value="${p}" ${p===UI.period?'selected':''}>${periodLabel(p)}${p===currentPeriod()?' (current)':''}</option>`).join('');
  const ls=document.getElementById('lockState');
  if(isLocked(UI.period)){ ls.className='lock closed'; ls.textContent='Locked · final'; }
  else if(UI.period<currentPeriod()){ ls.className='lock open'; ls.textContent='Unlocked by admin'; }
  else { ls.className='lock open'; ls.textContent='Open until '+closesOn(UI.period); }
  document.getElementById('loginBtn').textContent = UI.authed ? 'Log out RMAS' : 'RMAS login';
  renderSync();
}

function tsRows(){
  return DB.ts.map(t=>{ const st=storesOf(t.name); return {...t, n:st.length, t:tally(st,UI.period)}; });
}
function inScope(s){ return (!UI.region||s.region===UI.region)&&(!UI.agency||s.agency===UI.agency); }
function agencies(){ return [...new Set(DB.stores.map(s=>s.agency).filter(Boolean))].sort(); }
function agencySelect(id){ return `<select class="sel" id="${id}" aria-label="Filter by agency"><option value="">All agencies</option>${agencies().map(a=>`<option ${UI.agency===a?'selected':''}>${esc(a)}</option>`).join('')}</select>`; }

  const scope=DB.stores.filter(inScope), all=tally(scope,UI.period), rows=tsRows();
  const ranked = rows.filter(r=>r.t.pct!=null).sort((a,b)=>b.t.pct-a.t.pct || b.t.graded-a.t.graded);
  const unr = rows.filter(r=>r.t.pct==null);
  const regions = sortRegions([...new Set(DB.ts.map(t=>t.region))]);

  const v=document.getElementById('v-overview');
  v.innerHTML = `
  <div class="strip">
    <div class="cell hero"><span class="lbl">Deployment score · ${periodLabel(UI.period)}</span><span class="val num">${fmt(all.pct)}</span><span class="sub">${all.C+all.X} of ${all.graded} checked displays complete · <span class="pill g-${g.cls}">${g.label}</span></span>${meter(all)}</div>
    <div class="cell"><span class="lbl">Complete</span><span class="val num" style="color:var(--ok)">${all.C}</span><span class="sub">POSM fully deployed</span></div>
    <div class="cell"><span class="lbl">Complete – exempt</span><span class="val num" style="color:var(--ex)">${all.X}</span><span class="sub">no stock / outdated display</span></div>
    <div class="cell"><span class="lbl">Incomplete</span><span class="val num" style="color:var(--bad)">${all.I}</span><span class="sub">missing POSM</span></div>
    <div class="cell"><span class="lbl">Not checked</span><span class="val num">${all.NC}</span><span class="sub">${scope.length} stores × 3 BU</span></div>
  </div>
  <div class="filters"><select class="sel" id="ovRegion" aria-label="Filter by region"><option value="">All regions</option>${regions.map(r=>`<option ${UI.region===r?'selected':''}>${esc(r)}</option>`).join('')}</select>${agencySelect('ovAgency')}${(UI.region||UI.agency)?`<button class="btn ghost" type="button" id="ovClear">Clear filters</button>`:''}</div>
  <div class="sec-h"><div><h2>By agency</h2></div></div>
  <div class="regions">${agencies().map(a=>{const st=DB.stores.filter(s=>s.agency===a&&(!UI.region||s.region===UI.region));const t=tally(st,UI.period);const n=new Set(st.map(s=>s.ts)).size;return `<div class="regbox"${UI.agency&&UI.agency!==a?' style="opacity:.5"':''}><div class="top2"><h3>${esc(a)}</h3><span class="num">${fmt(t.pct)}</span></div><div class="sub">${n} TS · ${st.length} stores · ${t.I} incomplete · ${t.NC} not checked</div>${meter(t)}</div>`}).join('')}</div>
  <div class="sec-h"><div><h2>By region</h2></div></div>
  <div class="regions">${regions.map(r=>{const st=DB.stores.filter(s=>s.region===r&&(!UI.agency||s.agency===UI.agency));const t=tally(st,UI.period);const n=new Set(st.map(s=>s.ts)).size;return `<div class="regbox"><div class="top2"><h3>${esc(r)}</h3><span class="num">${fmt(t.pct)}</span></div><div class="sub">${n} TS · ${st.length} stores · ${t.I} incomplete · ${t.NC} not checked</div>${meter(t)}</div>`}).join('')}</div>
  <div class="sec-h"><div><h2>Trade Supervisor ranking</h2><p>TS score = complete displays ÷ checked displays across all their stores. Click a TS to see and grade their stores.</p></div>
</div>
  ${legend}
  <div class="tbl-wrap"><table><thead><tr><th>#</th><th>Trade Supervisor</th><th>Agency</th><th class="r">Stores</th><th class="r">Complete</th><th class="r">Exempt</th><th class="r">Incomplete</th><th class="r">Not checked</th><th>Score</th><th>Grade</th></tr></thead><tbody>
  ${[...ranked,...unr].filter(r=>(!UI.region||r.region===UI.region)&&(!UI.agency||r.agency===UI.agency)).map((r,i)=>{const gg=grade(r.t.pct);return `<tr class="click" data-ts="${esc(r.name)}" tabindex="0"><td class="rank num">${r.t.pct==null?'–':i+1}</td><td><div class="tsname">${esc(r.name)}</div><div class="reg">${esc(r.region)}</div></td><td>${esc(r.agency||'')}</td><td class="r num">${r.n}</td><td class="r num">${r.t.C}</td><td class="r num">${r.t.X}</td><td class="r num">${r.t.I}</td><td class="r num">${r.t.NC}</td><td><div class="bar"><span class="num">${fmt(r.t.pct)}</span>${meter(r.t)}</div></td><td><span class="pill g-${gg.cls}">${gg.label}</span></td></tr>`}).join('')}
  </tbody></table></div>`;
  v.querySelector('#ovRegion').onchange=e=>{UI.region=e.target.value;render();};
  v.querySelector('#ovAgency').onchange=e=>{UI.agency=e.target.value;render();};
  const oc=v.querySelector('#ovClear'); if(oc) oc.onclick=()=>{UI.region='';UI.agency='';render();};
  v.querySelectorAll('tr[data-ts]').forEach(tr=>{const go=()=>{UI.ts=tr.dataset.ts;UI.view='ts';render();scrollTo(0,0);}; tr.onclick=go; tr.onkeydown=e=>{if(e.key==='Enter')go();};});
}

function statusSelect(storeId,bu,val,editable){
  const c=STATUS[val||''].cls;
  return `<select class="st s-${c}" data-k="${storeId}|${bu}" aria-label="${bu} status" ${editable?'':'disabled'}>${STATUS_ORDER.map(k=>`<option value="${k}" ${k===(val||'')?'selected':''}>${STATUS[k].label}</option>`).join('')}</select>`;
}
function storeTable(list, showTs){
  const m=DB.months[UI.period]||{}, ed=canEdit();
  if(!list.length) return `<div class="tbl-wrap"><div class="empty">No stores match. ${DB.stores.length?'Try another filter.':'Import your store mapping in Setup.'}</div></div>`;
  return `<div class="tbl-wrap"><table><thead><tr><th>Store</th>${showTs?'<th>Trade Supervisor</th>':''}${BUS.map(b=>`<th>${b}</th>`).join('')}<th class="r">Store score</th><th>Remarks / missing POSM</th></tr></thead><tbody>
  ${list.map(s=>{const t=tally([s],UI.period);const rm=(m[s.id+'|note']||{}).s||'';return `<tr><td><div class="tsname">${esc(s.name)}</div><div class="reg">${esc([s.dealer,s.region,s.agency].filter(Boolean).join(' · '))}${UI.authed?` · <button class="lnk" type="button" data-edit-store="${s.id}">Edit / move</button>`:''}</div></td>${showTs?`<td>${esc(s.ts)}</td>`:''}${BUS.map(b=>`<td>${statusSelect(s.id,b,(m[s.id+'|'+b]||{}).s,ed)}</td>`).join('')}<td class="r num">${fmt(t.pct)}</td><td><input class="note" data-k="${s.id}|note" value="${esc(rm)}" placeholder="${ed?'e.g. missing HA wobbler':''}" ${ed?'':'disabled'} aria-label="Remarks for ${esc(s.name)}"></td></tr>`}).join('')}
  </tbody></table></div>`;
}
function bindEdits(root){
  root.querySelectorAll('[data-edit-store]').forEach(b=>b.onclick=()=>editStore(b.dataset.editStore));
  root.querySelectorAll('select.st').forEach(sel=>sel.onchange=e=>{
    setEntry(sel.dataset.k, sel.value);
    sel.className='st s-'+STATUS[sel.value].cls;
    render();
  });
  root.querySelectorAll('input.note').forEach(inp=>inp.onchange=()=>{ setEntry(inp.dataset.k, inp.value.trim()); toast('Remarks saved'); });
}
function setEntry(k,val){
  if(!canEdit()) return;
  setMany([{key:k,value:val}]);
}
/* apply locally right away, then send to the Google Sheet in the background */
function setMany(items, by){
  const m=monthData(UI.period);
  items.forEach(it=>{ if(it.value) m[it.key]={s:it.value, by:by||'RMAS', at:Date.now()}; else delete m[it.key];
    if(ONLINE) QUEUE.push({period:UI.period,key:it.key,value:it.value||'',by:by||'RMAS'}); });
  save(); saveQueue(); if(ONLINE) flush();
}
function editHint(){
  if(isLocked(UI.period)) return `<p class="reg">${periodLabel(UI.period)} is locked. These are the final grades for that month.</p>`;
  if(!UI.authed) return `<p class="reg">View only. Log in as RMAS to change statuses.</p>`;
  return `<p class="reg">Changes save immediately and count toward ${periodLabel(UI.period)} only.</p>`;
}
function renderTS(){
  const t0=DB.ts.find(t=>t.name===UI.ts); if(!t0){UI.view='overview';return render();}
  const st=storesOf(t0.name).sort((a,b)=>a.name.localeCompare(b.name)), t=tally(st,UI.period), g=grade(t.pct);
  const byBu = BUS.map(b=>({b,t:tally(st,UI.period,b)}));
  const v=document.getElementById('v-ts');
  v.innerHTML = `<button class="back" type="button" id="back">← All Trade Supervisors</button>
  <div class="ts-head"><div><div class="reg">${esc(t0.region)}${t0.agency?' · '+esc(t0.agency):''} · ${st.length} stores · ${periodLabel(UI.period)}</div><h2>${esc(t0.name)}</h2>${UI.authed?`<div class="row" style="margin-top:8px"><button class="btn ghost" type="button" id="editTs" style="min-height:30px;padding:3px 10px">Edit name / region</button><button class="btn ghost" type="button" id="trBtn" style="min-height:30px;padding:3px 10px">Transfer stores to another TS</button></div>`:''}</div>
    <div><div class="score num">${fmt(t.pct)}</div><span class="pill g-${g.cls}">${g.label}</span></div>
    ${byBu.map(x=>`<div style="min-width:120px"><div class="reg">${x.b}</div><div class="num" style="font-size:18px">${fmt(x.t.pct)}</div>${meter(x.t)}</div>`).join('')}
  </div>
  ${legend}${editHint()}
  ${canEdit()?`<div class="row" style="margin-bottom:10px"><button class="btn" type="button" id="copyPrev">Copy last month's statuses</button><button class="btn ghost" type="button" id="allC">Mark unchecked as Complete</button></div>`:''}
  ${storeTable(st,false)}`;
  v.querySelector('#back').onclick=()=>{UI.view='overview';render();};
  const et=v.querySelector('#editTs'); if(et) et.onclick=()=>editTs(t0.name);
  const tb=v.querySelector('#trBtn'); if(tb) tb.onclick=()=>transferStores(t0.name);
  bindEdits(v);
  const cp=v.querySelector('#copyPrev'); if(cp) cp.onclick=()=>{copyPrev(st);};
  const ac=v.querySelector('#allC'); if(ac) ac.onclick=()=>{const m=monthData(UI.period);const items=[];st.forEach(s=>BUS.forEach(b=>{if(!m[s.id+'|'+b]) items.push({key:s.id+'|'+b,value:'C'});}));setMany(items);render();toast(items.length+' displays marked Complete');};
}
function prevPeriod(p){let [y,m]=p.split('-').map(Number);m--;if(!m){m=12;y--;}return y+'-'+String(m).padStart(2,'0');}
function copyPrev(st){
  const pp=prevPeriod(UI.period), src=DB.months[pp];
  if(!src||pp<START_PERIOD){toast('No previous month to copy from');return;}
  const m=monthData(UI.period); const items=[];
  st.forEach(s=>BUS.forEach(b=>{const k=s.id+'|'+b; if(!m[k]&&src[k]) items.push({key:k,value:src[k].s});}));
  setMany(items,'RMAS (copied)');render();toast(items.length+' statuses copied from '+periodLabel(pp));
}

function renderStores(){
  const regions=sortRegions([...new Set(DB.ts.map(t=>t.region))]);
  const tsOpts=[...new Set(DB.stores.filter(inScope).map(s=>s.ts))].sort();
  const m=DB.months[UI.period]||{};
  let list=DB.stores.filter(s=>inScope(s)&&(!UI.tsF||s.ts===UI.tsF)&&(!UI.q||(s.name+' '+s.dealer+' '+s.ts+' '+(s.agency||'')).toLowerCase().includes(UI.q.toLowerCase())));
  if(UI.status) list=list.filter(s=>(UI.bu?[UI.bu]:BUS).some(b=>{const x=(m[s.id+'|'+b]||{}).s||'';return UI.status==='X'?(x==='XS'||x==='XO'):x===UI.status;}));
  list.sort((a,b)=>a.ts.localeCompare(b.ts)||a.name.localeCompare(b.name));
  const shown=list.slice(0,300);
  const v=document.getElementById('v-stores');
  v.innerHTML=`<div class="sec-h"><div><h2>All stores</h2><p>${list.length} stores${list.length>300?' · showing first 300, narrow the filters to see the rest':''}</p></div></div>
  <div class="filters">
    <input class="inp" id="fq" type="search" placeholder="Search store, dealer or TS" value="${esc(UI.q)}" aria-label="Search">
    <select class="sel" id="fr" aria-label="Region"><option value="">All regions</option>${regions.map(r=>`<option ${UI.region===r?'selected':''}>${esc(r)}</option>`).join('')}</select>
    ${agencySelect('fa')}
    <select class="sel" id="ft" aria-label="Trade Supervisor"><option value="">All TS</option>${tsOpts.map(t=>`<option ${UI.tsF===t?'selected':''}>${esc(t)}</option>`).join('')}</select>
    <select class="sel" id="fb" aria-label="BU"><option value="">All BU</option>${BUS.map(b=>`<option ${UI.bu===b?'selected':''}>${b}</option>`).join('')}</select>
    <select class="sel" id="fs" aria-label="Status"><option value="">Any status</option><option value="C" ${UI.status==='C'?'selected':''}>Complete</option><option value="X" ${UI.status==='X'?'selected':''}>Complete – exempt</option><option value="I" ${UI.status==='I'?'selected':''}>Incomplete POSM</option><option value="" disabled>──</option></select>
  </div>${editHint()}${storeTable(shown,true)}`;
  const q=v.querySelector('#fq'); q.oninput=()=>{UI.q=q.value;clearTimeout(q._t);q._t=setTimeout(()=>{render();const n=document.getElementById('fq');n.focus();n.setSelectionRange(n.value.length,n.value.length);},250);};
  v.querySelector('#fr').onchange=e=>{UI.region=e.target.value;UI.tsF='';render();};
  v.querySelector('#ft').onchange=e=>{UI.tsF=e.target.value;render();};
  v.querySelector('#fa').onchange=e=>{UI.agency=e.target.value;UI.tsF='';render();};
  v.querySelector('#fb').onchange=e=>{UI.bu=e.target.value;render();};
  v.querySelector('#fs').onchange=e=>{UI.status=e.target.value;render();};
  bindEdits(v);
}

function editTs(name){

  const st=storesOf(name), d=document.getElementById('tsDlg');
  const rs=sortRegions([...new Set(st.map(s=>s.region))]);
  const regs=sortRegions([...new Set([...REGION_ORDER,...DB.stores.map(s=>s.region)].filter(Boolean))]);
  document.getElementById('tsDlgText').textContent=`${st.length} stores · now in ${t.region}${rs.length>1?' (stores in '+rs.join(', ')+')':''}`;
  const nm=document.getElementById('tsName'); nm.value=name;
  document.getElementById('tsRegion').innerHTML=regs.map(r=>`<option ${r===t.region?'selected':''}>${esc(r)}</option>`).join('');
  document.getElementById('tsNote').textContent=`Changing the region moves all ${st.length} of their stores to it, so region totals and filters follow the TS.`;

document.getElementById('tsCancel').onclick=()=>document.getElementById('tsDlg').close();
document.getElementById('tsForm').onsubmit=async e=>{
  e.preventDefault();
  const d=document.getElementById('tsDlg'), old=d._ts, t=DB.ts.find(x=>x.name===old); if(!t){d.close();return;}
  const err=m=>{document.getElementById('tsErr').textContent=m;};
  const nn=normName(document.getElementById('tsName').value), reg=document.getElementById('tsRegion').value;
  if(!nn) return err('Name cannot be empty.');
  const clash=DB.ts.find(x=>x.name!==old&&(x.name===nn||nameKey(x.name)===nameKey(nn)));
  if(clash&&d._merge!==clash.name){ d._merge=clash.name; return err(`${clash.name} already exists. Press Save again to merge both into one TS.`); }
  const target=clash?clash.name:nn, regChanged=reg!==t.region||storesOf(old).some(s=>s.region!==reg);
  if(target===old&&!regChanged){ d.close(); return; }
  const parts=[]; if(target!==old) parts.push(clash?'merged into '+target:'renamed to '+target); if(regChanged) parts.push('region set to '+reg);
  const stores=DB.stores.map(s=>s.ts===old?{...s,ts:target,region:regChanged?reg:s.region}:s);
  const msg='TS '+old+': '+parts.join(', ');
  if(!await saveStores(stores,msg,'tsOk',err)) return;
  if(UI.ts===old) UI.ts=target; if(UI.tsF===old) UI.tsF=target;
  d.close(); render(); toast('Trade Supervisor updated');
};

function normName(n){ return String(n||'').toUpperCase().replace(/\s+/g,' ').trim(); }
function nameKey(n){ return normName(n).replace(/[^A-Z0-9 ]/g,' ').split(/\s+/).filter(Boolean).sort().join(' '); }
function importMapping(file){
  if(!file) return;
  if(typeof XLSX==='undefined'){ toast('Excel reader did not load. Check your connection.'); return; }
  const r=new FileReader();
  r.onload=()=>{
    let grid;
    try{ const wb=XLSX.read(r.result,{type:'array'}); grid=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''}); }catch(e){ toast('Could not read that file'); return; }
    const norm=k=>String(k).toUpperCase().replace(/[^A-Z]/g,'');
    const hi=grid.findIndex(row=>row.some(c=>['TRADESUPERVISOR','TS'].includes(norm(c))));
    if(hi<0){ toast('No TRADE SUPERVISOR column found'); return; }
    const H=grid[hi].map(norm), ix=names=>H.findIndex(h=>names.includes(h));
    const c={store:ix(['STORENAME','MCSSITENAME','SITENAME','STORE','STORES']),ts:ix(['TRADESUPERVISOR','TS']),region:ix(['REGION']),dealer:ix(['DEALER','DEALERNAME','ACCOUNT']),agency:ix(['AGENCY'])};
    if(c.store<0){ toast('No STORE NAME column found'); return; }
    const g=(row,i)=>i<0?'':normName(row[i]);
    const recs=grid.slice(hi+1).map(row=>({store:g(row,c.store),ts:g(row,c.ts),region:g(row,c.region),dealer:g(row,c.dealer),agency:g(row,c.agency)})).filter(x=>x.store&&x.ts);
    if(!recs.length){ toast('No store rows found under the header'); return; }
    const canon={}; DB.ts.forEach(t=>canon[nameKey(t.name)]=t.name);
    recs.forEach(x=>{ if(x.ts==='#N/A') x.ts='NO TS ASSIGNED'; const k=nameKey(x.ts); if(!canon[k]) canon[k]=x.ts; x.ts=canon[k]; });
    const old={}; DB.stores.forEach(s=>old[s.name]=s);
    let maxId=DB.stores.reduce((a,s)=>Math.max(a,parseInt(s.id.slice(1))||0),0), added=0, moved=0, seen={};
    const stores=[];
    recs.forEach(x=>{ if(seen[x.store]) return; seen[x.store]=1; const o=old[x.store];
      if(o){ if(o.ts!==x.ts) moved++; stores.push({...o,ts:x.ts,region:x.region||o.region,dealer:x.dealer||o.dealer,agency:x.agency||o.agency}); }
      else { added++; stores.push({id:'W'+String(++maxId).padStart(4,'0'),name:x.store,ts:x.ts,region:x.region,dealer:x.dealer,agency:x.agency}); }});
    const removed=DB.stores.length-(stores.length-added);
    const msg=`${added} added, ${moved} reassigned, ${removed} removed`;
    if(ONLINE){
      if(!UI.authed){ toast('Log in as RMAS first'); return; }
      toast('Uploading store list…');
      api({action:'importStores',pass:PASS,stores,note:file.name+': '+msg}).then(async r=>{ if(!r.ok){toast(r.error||'Upload failed');return;} await pull(); toast(msg+' · '+DB.ts.length+' TS'); });
      return;
    }
    DB.stores=stores; DB.ts=deriveTs(stores); DB.sample=false;
    DB.log.push(new Date().toLocaleString()+' · Store list imported: '+msg);
    save(); render(); toast(msg+' · '+DB.ts.length+' TS');
  };
  r.readAsArrayBuffer(file);
}

/* ===== Sync with the Google Sheet ===== */
async function api(body){
  const res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});
  return res.json();
}
function saveQueue(){ try{ localStorage.setItem(QKEY, JSON.stringify(QUEUE)); }catch(e){} }
let flushing=false;
async function flush(){
  if(!ONLINE||flushing||!QUEUE.length) return;
  if(!PASS){ SYNC.state='err'; renderSync(); return; }
  flushing=true; SYNC.state='busy'; renderSync();
  const batch=QUEUE.slice(0,400);
  try{
    const r=await api({action:'set',pass:PASS,items:batch});
    if(r.ok){ QUEUE=QUEUE.slice(batch.length); saveQueue(); SYNC.state='ok'; SYNC.at=new Date();
      if(r.rejected&&r.rejected.length){ toast(r.rejected.length+' change(s) not saved: that month is locked'); pullSoon(); } }
    else if(r.auth===false){ QUEUE=[]; saveQueue(); UI.authed=false; PASS=''; try{sessionStorage.removeItem('rmas_posm_pass');}catch(e){} toast('Password changed elsewhere. Log in again.'); pullSoon(); }
    else { SYNC.state='err'; toast(r.error||'Not saved'); }
  }catch(e){ SYNC.state='err'; }
  flushing=false; renderSync();
  if(QUEUE.length&&SYNC.state==='ok') flush(); else if(QUEUE.length) setTimeout(flush,10000);
}
let pullTimer=null;
function pullSoon(){ clearTimeout(pullTimer); pullTimer=setTimeout(pull,800); }
function editingNow(){ const a=document.activeElement; return a && a.closest && a.closest('.tbl-wrap,#v-setup,dialog') && /INPUT|SELECT|TEXTAREA/.test(a.tagName); }
async function pull(){
  if(!ONLINE) return;
  if(!PASS && !VIEW_KEY){ noAccess(); return; }
  try{
    const d=await api(PASS?{action:'read',pass:PASS}:{action:'read',key:VIEW_KEY});
    if(!d.ok){
      if(d.keyError){ noAccess(); return; }
      if(d.auth===false){ UI.authed=false; PASS=''; try{sessionStorage.removeItem('rmas_posm_pass');}catch(e){} toast('Password changed elsewhere. Log in again.'); if(VIEW_KEY) pullSoon(); else noAccess(); return; }
      throw 0;
    }
    if(PASS) UI.mustChange=!!d.mustChange;
    SYNC.serverEmpty=!d.stores.length;
    const stores = d.stores.length ? d.stores : DB.stores;
    // keep changes still waiting to be sent on top of what the sheet returned
    const months=d.months||{}; QUEUE.forEach(q=>{ const m=months[q.period]=months[q.period]||{}; if(q.value) m[q.key]={s:q.value,by:q.by,at:Date.now()}; else delete m[q.key]; });
    DB={...DB, stores, ts:deriveTs(stores), months: d.stores.length?months:DB.months, unlocked:d.unlocked||{}, closeDay:d.closeDay, log:d.log||[], sample:false};
    save();
    if(!periods().includes(UI.period)) UI.period=currentPeriod();
    if(SYNC.state!=='busy'){ SYNC.state='ok'; SYNC.at=new Date(); }
    if(editingNow()) renderSync(); else render();
  }catch(e){ SYNC.state='err'; renderSync(); }
}
function noAccess(){
  SYNC.state='nokey'; DB={...DB, months:{}, log:[]}; save(); if(editingNow()) renderSync(); else render();
  if(!noAccessShown){ noAccessShown=true; toast('No access — log in as RMAS, or open the latest viewer link (ends with ?key=…)'); }
}
function renderSync(){
  const el=document.getElementById('syncState'); if(!el) return;
  if(!ONLINE){ el.className='sync'; el.textContent='Offline · this browser only'; return; }
  if(SYNC.state==='nokey'){ el.className='sync err'; el.textContent='No access · log in or open the viewer link'; return; }
  const n=QUEUE.length;
  if(SYNC.state==='loading'){ el.className='sync busy'; el.textContent='Loading…'; }
  else if(SYNC.state==='busy'){ el.className='sync busy'; el.textContent='Saving '+n+'…'; }
  else if(SYNC.state==='err'){ el.className='sync err'; el.textContent=n?n+' unsaved · retrying':'Can\'t reach sheet · retrying'; }
  else { el.className='sync ok'; el.textContent=SYNC.serverEmpty?'Online · log in to upload stores':'Synced '+(SYNC.at?SYNC.at.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}):''); }
}
render();
if(ONLINE){
  pull().then(()=>{ if(QUEUE.length) flush(); });
  setInterval(()=>{ if(document.visibilityState==='visible') pull(); }, POLL_MS);
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') pull(); });
  window.addEventListener('online',()=>{ flush(); pull(); });
}
</script>

</body>
