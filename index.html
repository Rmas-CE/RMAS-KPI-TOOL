<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>POSM Deployment Tracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: sticky control bar (month + lock state) over a summary strip, then a TS ranking that drills into each TS's stores. Dark-first, VaultSync teal. */
:root{
  --bg:#0b1519; --panel:#11202600; --surface:#122329; --surface2:#17303a; --line:#21404b;
  --fg:#e3f1f3; --muted:#8aa8b0; --accent:#2fd6c3; --accent-ink:#04201c;
  --ok:#3ccf7e; --ok-bg:#123d29; --ex:#4fb3ff; --ex-bg:#0f2f4a; --bad:#ff8a5c; --bad-bg:#47220f;
  --nc:#7d939a; --nc-bg:#1a2b31; --warn-bg:#3a3111; --warn:#f2c94c;
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#eef4f5; --surface:#ffffff; --surface2:#e3eef0; --line:#c9dbdf;
  --fg:#0e2329; --muted:#4e6a72; --accent:#0a8f82; --accent-ink:#ffffff;
  --ok:#137a43; --ok-bg:#d8f3e3; --ex:#1660a8; --ex-bg:#dcebfb; --bad:#b4461b; --bad-bg:#fde5da;
  --nc:#5f747a; --nc-bg:#e6edef; --warn-bg:#fbf0c9; --warn:#7a5a00; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#eef4f5; --surface:#ffffff; --surface2:#e3eef0; --line:#c9dbdf;
  --fg:#0e2329; --muted:#4e6a72; --accent:#0a8f82; --accent-ink:#ffffff;
  --ok:#137a43; --ok-bg:#d8f3e3; --ex:#1660a8; --ex-bg:#dcebfb; --bad:#b4461b; --bad-bg:#fde5da;
  --nc:#5f747a; --nc-bg:#e6edef; --warn-bg:#fbf0c9; --warn:#7a5a00; color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--f-body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin-bottom:18px}
.top-in{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding-block:12px}
.brand{display:flex;flex-direction:column;margin-right:auto;min-width:0}
.brand small{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.14em;color:var(--accent);font-size:11px;font-weight:600}
.brand h1{font-size:22px;line-height:1.1}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sel,.btn,.inp{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-height:36px}
.btn{font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.lock{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;font-family:var(--f-display);text-transform:uppercase;letter-spacing:.08em}
.lock.open{background:var(--ok-bg);color:var(--ok)}
.lock.closed{background:var(--warn-bg);color:var(--warn)}
.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:0}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.03em;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{color:var(--fg);border-color:var(--accent)}

.sync{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--nc)}
.sync.ok::before{background:var(--ok)} .sync.busy::before{background:var(--warn)} .sync.err::before{background:var(--bad)}
.banner{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:10px 14px;margin-bottom:16px;font-size:13px}
.banner b{font-weight:600}
.banner .btn{min-height:30px;padding:4px 10px;background:transparent;border-color:currentColor;color:inherit}

/* summary strip */
.strip{display:grid;grid-template-columns:1.4fr repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:22px}
.cell{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.cell .lbl{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.1em;font-size:11.5px;color:var(--muted);font-weight:600}
.cell .val{font-size:26px;line-height:1.15}
.cell .sub{font-size:12px;color:var(--muted)}
.cell.hero .val{font-size:40px;color:var(--accent)}
.meter{height:8px;border-radius:4px;background:var(--surface2);display:flex;overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%}
.m-ok{background:var(--ok)} .m-ex{background:var(--ex)} .m-bad{background:var(--bad)} .m-nc{background:var(--nc-bg)}
@media (max-width:760px){.strip{grid-template-columns:1fr 1fr}.cell.hero{grid-column:1/-1}}

.sec-h{display:flex;flex-wrap:wrap;gap:10px;align-items:end;justify-content:space-between;margin:6px 0 10px}
.sec-h h2{font-size:20px}
.sec-h p{margin:0;color:var(--muted);font-size:13px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.filters .inp{min-width:0;flex:1 1 180px}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:720px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.08em;font-size:11.5px;color:var(--muted);font-weight:600;background:var(--surface2);position:sticky;top:0}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface2)}
.rank{color:var(--muted);width:40px}
.tsname{font-weight:600}
.reg{font-size:12px;color:var(--muted)}
.bar{display:flex;align-items:center;gap:8px;min-width:150px}
.bar .meter{flex:1;margin:0;height:6px}

.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.g-out,.g-exc{background:var(--ok-bg);color:var(--ok)}
.g-vg,.g-good{background:var(--ex-bg);color:var(--ex)}
.g-ni,.g-poor{background:var(--bad-bg);color:var(--bad)}
.g-none{background:var(--nc-bg);color:var(--nc)}

/* status select chips */
.st{appearance:none;-webkit-appearance:none;border:1px solid transparent;border-radius:6px;padding:5px 26px 5px 9px;font-size:12.5px;font-weight:600;min-width:150px;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 13px) 55%,calc(100% - 8px) 55%;background-size:5px 5px;background-repeat:no-repeat}
.st:disabled{opacity:1;background-image:none;padding-right:9px;cursor:default}
.s-ok{background-color:var(--ok-bg);color:var(--ok)}
.s-ex{background-color:var(--ex-bg);color:var(--ex)}
.s-bad{background-color:var(--bad-bg);color:var(--bad)}
.s-nc{background-color:var(--nc-bg);color:var(--nc)}
.s-na{background-color:transparent;color:var(--muted);border-color:var(--line)}
.st option{background:var(--surface);color:var(--fg)}
.note{width:100%;min-width:180px;background:transparent;border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:13px}
.note:disabled{border-color:transparent;padding-inline:0}

/* TS detail */
.back{background:none;border:0;color:var(--accent);font-weight:600;padding:0;margin-bottom:10px}
.ts-head{display:flex;flex-wrap:wrap;gap:14px 28px;align-items:flex-end;margin-bottom:16px}
.ts-head h2{font-size:30px;line-height:1.05}
.ts-head .score{font-size:44px;color:var(--accent);line-height:1}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:12.5px;color:var(--muted);margin:0 0 14px}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

.regions{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-bottom:24px}
.regbox{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.regbox .top2{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.regbox h3{font-size:15px;letter-spacing:.04em}
.regbox .num{font-size:20px}
.regbox .sub{font-size:12px;color:var(--muted)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:14px}
.panel h3{font-size:17px;margin-bottom:6px}
.panel p{margin:0 0 10px;color:var(--muted);max-width:68ch}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.log{font-size:12.5px;color:var(--muted);max-height:220px;overflow:auto;margin:0;padding-left:18px}
.empty{padding:28px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:8px;font-weight:600;font-size:13px;z-index:20}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--fg);padding:20px;max-width:min(420px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog h3{font-size:18px;margin-bottom:8px}
dialog p{color:var(--muted);margin:0 0 12px}
dialog .inp{width:100%;margin-bottom:10px}
.err{color:var(--bad);font-size:13px;min-height:1.2em;margin:0 0 8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<header class="top">
  <div class="wrap" style="padding-bottom:0">
    <div class="top-in">
      <div class="brand"><small>RMAS · VaultSync</small><h1>POSM Deployment Tracker</h1></div>
      <div class="ctrl">
        <label class="sr" for="period" hidden>Month</label>
        <select id="period" class="sel" aria-label="Month"></select>
        <span id="lockState" class="lock"></span>
        <span id="syncState" class="sync" role="status"></span>
        <button id="loginBtn" class="btn ghost" type="button">RMAS login</button>
      </div>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-view="overview" aria-selected="true">Overview</button>
      <button class="tab" role="tab" data-view="stores" aria-selected="false">All stores</button>
      <button class="tab" role="tab" data-view="setup" aria-selected="false">Setup</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <div id="sampleBanner" class="banner" hidden>
    <span><b>Sample stores only.</b> Import your store mapping in Setup to replace them.</span>
    <button class="btn" type="button" id="goSetup">Go to Setup</button>
  </div>
  <section id="v-overview"></section>
  <section id="v-ts" hidden></section>
  <section id="v-stores" hidden></section>
  <section id="v-setup" hidden></section>
</main>

<dialog id="dlg">
  <form id="dlgForm" method="dialog">
    <h3 id="dlgTitle"></h3>
    <p id="dlgText"></p>
    <input id="dlgInput" class="inp" type="password" autocomplete="off">
    <input id="dlgInput2" class="inp" type="text" autocomplete="off" hidden>
    <p class="err" id="dlgErr"></p>
    <div class="row" style="justify-content:flex-end">
      <button class="btn ghost" type="button" id="dlgCancel">Cancel</button>
      <button class="btn primary" type="submit" id="dlgOk">OK</button>
    </div>
  </form>
</dialog>

  return {stores, ts:deriveTs(stores), months:{}, unlocked:{}, pass:'rmas2026', log:[], sample:false, dataVer:DATA_VER, closeDay:7};
}
/* TS region = region where they hold the most stores; agency likewise */
function deriveTs(stores, prev){
  const m={};
  stores.forEach(s=>{const x=m[s.ts]=m[s.ts]||{r:{},a:{}}; x.r[s.region]=(x.r[s.region]||0)+1; if(s.agency) x.a[s.agency]=(x.a[s.agency]||0)+1;});
  const top=o=>(Object.entries(o).sort((a,b)=>b[1]-a[1])[0]||[''])[0];
  return Object.entries(m).map(([name,x])=>({name,region:top(x.r),agency:top(x.a)})).sort((a,b)=>a.name.localeCompare(b.name));
}

/* ===== Periods & locking ===== */
/* A grading month runs until day closeDay of the next month (default 7): October = entries up to Nov 7. */
function closeDay(){ const d=DB&&DB.closeDay; return d==null?7:Number(d); }
function currentPeriod(){
  const d = new Date(Date.now() - closeDay()*86400000);
  const s = d.toLocaleString('en-CA',{timeZone:'Asia/Manila',year:'numeric',month:'2-digit'});
  const p = s.slice(0,7).replace('/','-');
  return p < START_PERIOD ? START_PERIOD : p;
}
function closesOn(p){
  let [y,m]=p.split('-').map(Number); const cd=closeDay();
  return cd===0 ? new Date(y,m,0).toLocaleString('en-US',{month:'short',day:'numeric'}) : new Date(y,m,cd).toLocaleString('en-US',{month:'short',day:'numeric'});
}
function periods(){
  const out=[]; let [y,m]=START_PERIOD.split('-').map(Number);
  const cur=currentPeriod();
  while(true){ const p=y+'-'+String(m).padStart(2,'0'); out.push(p); if(p>=cur) break; m++; if(m>12){m=1;y++;} }
  return out.reverse();
}
function periodLabel(p){ const [y,m]=p.split('-').map(Number); return new Date(y,m-1,1).toLocaleString('en-US',{month:'long',year:'numeric'}); }

function tally(storeList, p, buF){
  const m = DB.months[p]||{}; const t={C:0,X:0,I:0,NC:0,NA:0};
  storeList.forEach(s=>(buF?[buF]:BUS).forEach(bu=>{
    const s0=(m[s.id+'|'+bu]||{}).s||'';
    if(s0==='C') t.C++; else if(s0==='XS'||s0==='XO') t.X++; else if(s0==='I') t.I++; else if(s0==='NA') t.NA++; else t.NC++;
  }));
  const graded=t.C+t.X+t.I; t.graded=graded; t.pct = graded? (t.C+t.X)/graded*100 : null; t.total=graded+t.NC;
  return t;
}

function sortRegions(list){ return list.sort((a,b)=>{const ia=REGION_ORDER.indexOf(a), ib=REGION_ORDER.indexOf(b); return (ia<0?99:ia)-(ib<0?99:ib) || a.localeCompare(b);}); }

}

/* ===== Import mapping ===== */
function normName(n){ return String(n||'').toUpperCase().replace(/\s+/g,' ').trim(); }
function nameKey(n){ return normName(n).replace(/[^A-Z0-9 ]/g,' ').split(/\s+/).filter(Boolean).sort().join(' '); }
function importMapping(file){
  if(!file) return;
  if(typeof XLSX==='undefined'){ toast('Excel reader did not load. Check your connection.'); return; }
  const r=new FileReader();
  r.onload=()=>{
    let grid;
    try{ const wb=XLSX.read(r.result,{type:'array'}); grid=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''}); }catch(e){ toast('Could not read that file'); return; }
    const norm=k=>String(k).toUpperCase().replace(/[^A-Z]/g,'');
    const hi=grid.findIndex(row=>row.some(c=>['TRADESUPERVISOR','TS'].includes(norm(c))));
    if(hi<0){ toast('No TRADE SUPERVISOR column found'); return; }
    const H=grid[hi].map(norm), ix=names=>H.findIndex(h=>names.includes(h));
    const c={store:ix(['STORENAME','MCSSITENAME','SITENAME','STORE','STORES']),ts:ix(['TRADESUPERVISOR','TS']),region:ix(['REGION']),dealer:ix(['DEALER','DEALERNAME','ACCOUNT']),agency:ix(['AGENCY'])};
    if(c.store<0){ toast('No STORE NAME column found'); return; }
    const g=(row,i)=>i<0?'':normName(row[i]);
    const recs=grid.slice(hi+1).map(row=>({store:g(row,c.store),ts:g(row,c.ts),region:g(row,c.region),dealer:g(row,c.dealer),agency:g(row,c.agency)})).filter(x=>x.store&&x.ts);
    if(!recs.length){ toast('No store rows found under the header'); return; }
    const canon={}; DB.ts.forEach(t=>canon[nameKey(t.name)]=t.name);
    recs.forEach(x=>{ if(x.ts==='#N/A') x.ts='NO TS ASSIGNED'; const k=nameKey(x.ts); if(!canon[k]) canon[k]=x.ts; x.ts=canon[k]; });
    const old={}; DB.stores.forEach(s=>old[s.name]=s);
    let maxId=DB.stores.reduce((a,s)=>Math.max(a,parseInt(s.id.slice(1))||0),0), added=0, moved=0, seen={};
    const stores=[];
    recs.forEach(x=>{ if(seen[x.store]) return; seen[x.store]=1; const o=old[x.store];
      if(o){ if(o.ts!==x.ts) moved++; stores.push({...o,ts:x.ts,region:x.region||o.region,dealer:x.dealer||o.dealer,agency:x.agency||o.agency}); }
      else { added++; stores.push({id:'W'+String(++maxId).padStart(4,'0'),name:x.store,ts:x.ts,region:x.region,dealer:x.dealer,agency:x.agency}); }});
    const removed=DB.stores.length-(stores.length-added);
    const msg=`${added} added, ${moved} reassigned, ${removed} removed`;
    if(ONLINE){
      if(!UI.authed){ toast('Log in as RMAS first'); return; }
      toast('Uploading store list…');
      api({action:'importStores',pass:PASS,stores,note:file.name+': '+msg}).then(async r=>{ if(!r.ok){toast(r.error||'Upload failed');return;} await pull(); toast(msg+' · '+DB.ts.length+' TS'); });
      return;
    }
    DB.stores=stores; DB.ts=deriveTs(stores); DB.sample=false;
    DB.log.push(new Date().toLocaleString()+' · Store list imported: '+msg);
    save(); render(); toast(msg+' · '+DB.ts.length+' TS');
  };
  r.readAsArrayBuffer(file);
}

/* ===== Export ===== */
function csv(rows){ return rows.map(r=>r.map(v=>{v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}).join(',')).join('\n'); }
function download(name,text,type){ const b=new Blob([text],{type:type||'text/csv'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name; document.body.appendChild(a); a.click(); a.remove(); toast('Downloading '+name); }
function exportStores(){
  const m=DB.months[UI.period]||{};

  download('POSM_Deployment_Stores_'+UI.period+'.csv',csv(rows));
}
function exportTs(){
  const rows=[['Month','Region','Agency','Trade Supervisor','Stores','Complete','Complete - exempt','Incomplete','Not checked','Score %','Grade']];
  tsRows().forEach(r=>rows.push([UI.period,r.region,r.agency||'',r.name,r.n,r.t.C,r.t.X,r.t.I,r.t.NC,r.t.pct==null?'':r.t.pct.toFixed(1),grade(r.t.pct).label]));

}

  if(UI.authed){UI.authed=false;PASS='';try{sessionStorage.removeItem('rmas_posm_pass');}catch(e){}render();toast('Logged out');return;}
  ask({title:'RMAS login',text:'Enter the RMAS password to grade stores.',input:true,ok:'Log in'},async pw=>{
    if(ONLINE){
      const r=await api({action:'login',pass:pw}); if(!r.ok) return r.error||'Wrong password.';
      PASS=pw; try{sessionStorage.setItem('rmas_posm_pass',pw);}catch(e){}
      UI.authed=true;
      if(!r.hasStores) await seedServer();
    } else { if(pw!==DB.pass)return 'Wrong password.'; UI.authed=true; }
    render();toast('Logged in as RMAS');});
};

/* ===== Sync with the Google Sheet ===== */
async function api(body){
  const res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});
  return res.json();
}
function saveQueue(){ try{ localStorage.setItem(QKEY, JSON.stringify(QUEUE)); }catch(e){} }
let flushing=false;
async function flush(){
  if(!ONLINE||flushing||!QUEUE.length) return;
  if(!PASS){ SYNC.state='err'; renderSync(); return; }
  flushing=true; SYNC.state='busy'; renderSync();
  const batch=QUEUE.slice(0,400);
  try{
    const r=await api({action:'set',pass:PASS,items:batch});
    if(r.ok){ QUEUE=QUEUE.slice(batch.length); saveQueue(); SYNC.state='ok'; SYNC.at=new Date();
      if(r.rejected&&r.rejected.length){ toast(r.rejected.length+' change(s) not saved: that month is locked'); pullSoon(); } }
    else if(r.auth===false){ QUEUE=[]; saveQueue(); UI.authed=false; PASS=''; try{sessionStorage.removeItem('rmas_posm_pass');}catch(e){} toast('Password changed elsewhere. Log in again.'); pullSoon(); }
    else { SYNC.state='err'; toast(r.error||'Not saved'); }
  }catch(e){ SYNC.state='err'; }
  flushing=false; renderSync();
  if(QUEUE.length&&SYNC.state==='ok') flush(); else if(QUEUE.length) setTimeout(flush,10000);
}
/* first admin login on an empty sheet: upload the built-in store list and any statuses already entered in this browser */
async function seedServer(){
  toast('Uploading the store list to the Google Sheet…');
  const r=await api({action:'importStores',pass:PASS,stores:DB.stores,note:'first upload ('+DATA_VER+')'});
  if(!r.ok){ toast(r.error||'Store upload failed'); return; }
  Object.entries(DB.months||{}).forEach(([p,m])=>Object.entries(m).forEach(([k,v])=>{ if(!isLocked(p)) QUEUE.push({period:p,key:k,value:v.s,by:v.by||'RMAS'}); }));
  saveQueue(); await flush(); await pull();
}
let pullTimer=null;
function pullSoon(){ clearTimeout(pullTimer); pullTimer=setTimeout(pull,800); }
function editingNow(){ const a=document.activeElement; return a && a.closest && a.closest('.tbl-wrap,#v-setup,dialog') && /INPUT|SELECT|TEXTAREA/.test(a.tagName); }
async function pull(){
  if(!ONLINE) return;
  try{
    const res=await fetch(API_URL+'?action=all&t='+Date.now()); const d=await res.json();
    if(!d.ok) throw 0;
    SYNC.serverEmpty=!d.stores.length;
    const stores = d.stores.length ? d.stores : DB.stores;
    // keep changes still waiting to be sent on top of what the sheet returned
    const months=d.months||{}; QUEUE.forEach(q=>{ const m=months[q.period]=months[q.period]||{}; if(q.value) m[q.key]={s:q.value,by:q.by,at:Date.now()}; else delete m[q.key]; });
    DB={...DB, stores, ts:deriveTs(stores), months: d.stores.length?months:DB.months, unlocked:d.unlocked||{}, closeDay:d.closeDay, log:d.log||[], sample:false};
    save();
    if(!periods().includes(UI.period)) UI.period=currentPeriod();
    if(SYNC.state!=='busy'){ SYNC.state='ok'; SYNC.at=new Date(); }
    if(editingNow()) renderSync(); else render();
  }catch(e){ SYNC.state='err'; renderSync(); }
}
function renderSync(){
  const el=document.getElementById('syncState'); if(!el) return;
  if(!ONLINE){ el.className='sync'; el.textContent='Offline · this browser only'; return; }
  const n=QUEUE.length;
  if(SYNC.state==='loading'){ el.className='sync busy'; el.textContent='Loading…'; }
  else if(SYNC.state==='busy'){ el.className='sync busy'; el.textContent='Saving '+n+'…'; }
  else if(SYNC.state==='err'){ el.className='sync err'; el.textContent=n?n+' unsaved · retrying':'Can\'t reach sheet · retrying'; }
  else { el.className='sync ok'; el.textContent=SYNC.serverEmpty?'Online · log in to upload stores':'Synced '+(SYNC.at?SYNC.at.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}):''); }
}
render();
if(ONLINE){
  pull().then(()=>{ if(QUEUE.length) flush(); });
  setInterval(()=>{ if(document.visibilityState==='visible') pull(); }, POLL_MS);
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') pull(); });
  window.addEventListener('online',()=>{ flush(); pull(); });
}
</script>
